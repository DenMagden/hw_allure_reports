plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(
            "com.codeborne:selenide:7.19.0",
            'net.datafaker:datafaker:2.7.0',
            "org.junit.jupiter:junit-jupiter:5.14.2")
    testImplementation 'io.qameta.allure:allure-selenide:2.35.5'
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

allure {
        version.set("2.32.0")
    adapter {
        aspectjWeaver.set(true)
        allureJavaVersion.set('2.35.5')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty 'selenide.timeout', '10000'

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "full"
        }
    }
}
